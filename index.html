<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><title>Подход</title></head><body><header><small id="phase"></small><h1>Подход</h1><p id="notice"></p><nav id="tabs"></nav></header><section class="card"><h2 id="title"></h2><p id="progress"></p><progress id="bar" max="100"></progress></section><main id="exercises"></main><button id="finish" class="primary">Завершить тренировку</button><section class="card"><h2>Данные</h2><label>Начало цикла<input id="start" type="date"></label><div class="actions"><button id="export">Экспорт</button><button id="import">Импорт</button></div><input id="file" type="file" accept=".json,application/json" hidden><p class="muted">История хранится на устройстве. Делай резервные копии.</p><div id="history"></div></section><footer><div><small id="timerLabel">Отдых</small><div id="clock">03:00</div></div><button id="restart">3 мин</button><button id="skip">Пропустить</button></footer><div id="overlay" hidden><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle"><div class="actions"><button id="cancel">Отмена</button><strong id="pickerTitle"></strong><button id="done">Готово</button></div><div class="wheel-wrap"><div class="highlight"></div><div id="wheel" tabindex="0" role="listbox" aria-label="Выбор числа"></div></div><button id="manual">Ввести вручную</button></section></div><script src="app.js"></script></body></html>
